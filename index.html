<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <!-- google fonts  -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lily+Script+One&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Fylo data storage component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
 <style>
    :root {
      /* colors  */
      --clr-primary1:  hsl(6, 100%, 80%);
      --clr-primary2: hsl(335, 100%, 65%);

      --neutra-clr-200: hsl(243, 100%, 93%);
      --neutra-clr-300:  hsl(229, 7%, 55%);
      --neutra-clr-400:  hsl(228, 56%, 26%);
      --neutra-clr-500: hsl(229, 57%, 11%);


    }

    /* general rest  */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    img,
    svg,
    iframe,
    picture {
      display: block;
      width: 100%;
    }

    html {
      color-scheme: dark;
      font-family: 'Raleway', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1rem;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-image: url(./images/bg-mobile.png);
      background-repeat: no-repeat;
      background-size: cover;
     

      @media (min-width: 45em) {
        background-image: url(./images/bg-desktop.png);
      }
    }
    .flex {
      display: flex;
    }

    .grid {
      display: grid;
      color-interpolation-filters: auto;
    }
    
    .container {
      padding: 2rem;
      gap: 1.2rem;
      place-items: center;
      grid-template-columns: auto;

      @media (min-width: 35em) {
        grid-template-columns: 1fr auto;
      }
    }
    
    .primary-header {
      margin: auto;
      flex-direction: column;
      gap: 1.5rem;
      background-color: var(--neutra-clr-400);
      padding: 1.8rem 2rem;
      border-radius: 1rem  5rem 1rem 1rem;
      width: 100%;
    }
    .logo-container {
      width: 150px;
    
    }
    .image-container {
      align-items: center;
      gap: 1.2rem;
    }
    .image-container div {
      padding: 1rem;
      width: 50px;
      background-color: var(--neutra-clr-500);
      border-radius: 1rem;
      
      img {
        aspect-ratio: 1;
      }
    }

    .content {
      background-color: var(--neutra-clr-400);
      padding: 2rem;
      border-radius: 1rem;
      position: relative;

      
    }
    .label {
      color: hsl( from #fff h s l / .8);
      padding-block-end: 1rem;
      margin-bottom: 1rem;
    }
    progress {
      appearance: none;
      -webkit-appearance: none;
      border-radius: 100vh;
      overflow: hidden;
      width: 100%;
      position: relative;
      
      &::after {
        content: "";
        width: 10px;
        height: 10px;
        background-color: #fff;
      }
    }
    progress::-webkit-progress-bar {
      background:hsl( from var(--neutra-clr-500) h s l / .5);
      
    }
    progress::-webkit-progress-value {
      background: linear-gradient( to right, var(--clr-primary1) 30%, var(--clr-primary2, deeppink));
      border-radius: 2rem;
      position: relative;
      
    }
    .progress-container {
    margin-top: 1rem;
    width: 100%;
    position: relative;
  }
  .progress-dot {
   width: .76rem;
   height:.76rem;
   background-color: white;
   border: 0;
   position: absolute;
   inset: 0;
   left: 76%;
   top: .2rem;
   margin-block: auto;
   border-radius: 50%;
   box-shadow: 0 0 0 2rem .25rem palevioletred;
  }

  .absolute-content {
    position: absolute;
    width: 50%;
    border-radius: .5rem;
    background-color: #fff;
    top: 80%;
    left: 22%;
    padding: .6rem;

    @media (min-width: 45em) {
      transform: translate(30%,-265%);
      &::before {
        content: "";
        border: 14px solid;
        border-bottom-color: transparent ;
        border-left-color: transparent;
        position: absolute;
        top: 80%;
        left: 82.4%;
        transform: rotate();
      }
      
    }

    p {
      font-size: 2rem;
      color: hsl( from var(--neutra-clr-500) h s l / .9);
      font-weight: 800;
      align-items: center;
      gap: .5rem;

      .small {
        font-size: .8rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: hsl(from var(--neutra-clr-500) h s l / .5);
      }
      .up {
        margin: .2rem 0 0 -.4rem;

        /* position: relative; */
        font-style: italic;
      }
    }
  }

  .absolute-content + div {
    justify-content: space-between;
    align-items: flex-end;
    margin-top: .5rem;
    color: hsl(from #fff h s l / .8);

  }
  .attribution {
    font-size: .8rem;
    letter-spacing: 1px;
    position: fixed;
    top: 97%;
    
    a {
      color: inherit;
    }
  }

   
 </style>
</head>
<body>

  <div class="container grid">
    <header class="primary-header flex">
      <div class="logo-container">
        <img src="./images/logo.svg" alt="the logo of the page">
      </div>
      <div class="image-container flex">
        <div><img src="./images/icon-document.svg" alt="the document illustration"></div>
        <div><img src="./images/icon-folder.svg" alt="the folder illustration svg"></div>
        <div><img src="./images/icon-upload.svg" alt="the apload illustration svg"></div>

      </div>
    </header>
    <main class="content">
      <label  for="progress-tracker" class="label">You’ve used <strong>815GB</strong> of your storage</label>
       <div class="progress-container">
         <progress
            id="progress-tracker"
            value="815" max="1000">
         </progress>
         <div class="progress-dot"></div>
       </div>
      <div class="absolute-content">
        <p class="flex"><span>18</span> <span class="up">5</span> <span class="small">GB Left</span></p>
      </div>
      <div class="flex track-num">
        <p>0 GB</p>
        <p>1000 GB</p>
      </div>
    </main>
  </div>
    <div class="test-shape"></div>
  <footer class="attribution">
    <address>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">josh balyathire</a>.
    </address>
  </footer>
</body>
</html>
